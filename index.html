<!-- El tema se resuelve antes del primer pintado para evitar el destello blanco. -->
<script>
(function () {
  var p = 'auto';
  try { p = localStorage.getItem('hogarya-theme') || 'auto'; } catch (e) { }
  if (!/^(light|dark|auto)$/.test(p)) p = 'auto';
  var dark = p === 'dark' || (p === 'auto' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var h = document.documentElement;
  h.setAttribute('data-theme', dark ? 'dark' : 'light');
  h.setAttribute('data-theme-pref', p);
})();
</script>
